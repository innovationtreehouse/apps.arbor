name: Deploy to Dev

on:
  # Only deploy when CI passes — prevents a broken push to main from deploying.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write      # required for OIDC → AWS
  contents: read       # required for checkout and git log
  actions: none
  checks: none
  issues: none
  packages: write      # required to push images to ghcr.io
  pull-requests: write # required to comment on merged PRs
  statuses: none

concurrency:
  group: deploy-dev
  cancel-in-progress: false  # queue rather than cancel — migrations must not interleave

jobs:
  deploy-dev:
    if: github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/deploy.yml
    with:
      target: dev
      sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
