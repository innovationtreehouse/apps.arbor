name: Claude

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Set AGENT_NAME from a repository variable (Settings → Variables).
# Falls back to "Squirrel" if the variable is not configured.
env:
  AGENT_NAME: ${{ vars.AGENT_NAME || 'Squirrel' }}
  BOT_ACTOR:  ${{ vars.BOT_ACTOR }}

jobs:
  # ---------------------------------------------------------------------------
  # New issue → propose implementation in a PR
  # ---------------------------------------------------------------------------

  claude-issue:
    name: Propose implementation
    runs-on: ubuntu-latest
    continue-on-error: true
    if: >
      github.event_name == 'issues' &&
      (github.event.action == 'opened' || github.event.action == 'labeled') &&
      contains(github.event.issue.labels.*.name, 'claude')
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: claude-issue-${{ github.event.issue.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build prompt
        id: prompt
        run: node scripts/build-claude-prompt.js
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_TOKEN }}

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Run Claude
        if: steps.prompt.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          custom_bun_path: /home/runner/.bun/bin/bun
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_TOKEN }}
          github_token:      ${{ secrets.AGENT_TOKEN }}
          prompt:     ${{ steps.prompt.outputs.prompt }}
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(git fetch *)", "Bash(git checkout *)",
                  "Bash(git add *)", "Bash(git commit *)", "Bash(git push *)",
                  "Bash(gh pr create *)", "Bash(gh issue comment *)", "Edit(**)", "Write(**)","Grep()","Glob()"
                ],
                "deny": [
                  "Edit(.github/**)", "Write(.github/**)"
                ]
              }
            }

  # ---------------------------------------------------------------------------
  # Comment on a plain issue → update the related PR
  # ---------------------------------------------------------------------------

  claude-issue-comment:
    name: Update PR from issue comment
    runs-on: ubuntu-latest
    continue-on-error: true
    if: >
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'claude') &&
      github.event.comment.user.login != vars.BOT_ACTOR
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: claude-issue-${{ github.event.issue.number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build prompt
        id: prompt
        run: node scripts/build-claude-prompt.js
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_TOKEN }}

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Run Claude
        if: steps.prompt.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          custom_bun_path: /home/runner/.bun/bin/bun
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_TOKEN }}
          github_token:      ${{ secrets.AGENT_TOKEN }}
          prompt:     ${{ steps.prompt.outputs.prompt }}
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(git fetch *)", "Bash(git checkout *)",
                  "Bash(git add *)", "Bash(git commit *)", "Bash(git push *)",
                  "Bash(gh issue comment *)", "Bash(gh pr create *)","Edit(**)", "Write(**)","Grep()","Glob()"
                ],
                "deny": [
                  "Edit(.github/**)", "Write(.github/**)"
                ]
              }
            }

  # ---------------------------------------------------------------------------
  # Comment on Claude's own PR → address the feedback
  # Handles both timeline comments (issue_comment) and inline diff comments
  # (pull_request_review_comment).  The build-claude-prompt script outputs
  # skip=true if the PR head branch does not start with "claude/".
  # ---------------------------------------------------------------------------

  claude-pr-comment:
    name: Address PR comment
    runs-on: ubuntu-latest
    continue-on-error: true
    if: >
      (github.event_name == 'issue_comment' &&
       github.event.action == 'created' &&
       github.event.issue.pull_request &&
       github.event.comment.user.login != vars.BOT_ACTOR) ||
      (github.event_name == 'pull_request_review_comment' &&
       github.event.action == 'created' &&
       github.event.comment.user.login != vars.BOT_ACTOR)
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: >-
        claude-pr-comment-${{
          github.event.issue.number ||
          github.event.pull_request.number
        }}
      cancel-in-progress: false

    steps:
      - name: Warn if BOT_ACTOR is unset
        if: vars.BOT_ACTOR == ''
        run: |
          echo "::warning::BOT_ACTOR repository variable is not set. The bot comment loop guard is inactive — the agent may respond to its own comments. Configure BOT_ACTOR in Settings → Variables."

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build prompt
        id: prompt
        run: node scripts/build-claude-prompt.js
        env:
          GITHUB_TOKEN: ${{ secrets.AGENT_TOKEN }}

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Run Claude
        if: steps.prompt.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          custom_bun_path: /home/runner/.bun/bin/bun
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_TOKEN }}
          github_token:      ${{ secrets.AGENT_TOKEN }}
          prompt:     ${{ steps.prompt.outputs.prompt }}
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(git fetch *)", "Bash(git checkout *)",
                  "Bash(git add *)", "Bash(git commit *)", "Bash(git push *)",
                  "Bash(gh pr review *)", "Bash(gh pr comment *)", "Edit(**)", "Write(**)","Grep()","Glob()"
                ],
                "deny": [
                  "Edit(.github/**)", "Write(.github/**)"
                ]
              }
            }
